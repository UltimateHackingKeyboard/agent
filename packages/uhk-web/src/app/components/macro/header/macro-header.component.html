<uhk-header>
    <div class="pane-title">
        <fa-icon [icon]="faPlay"></fa-icon>
        <auto-grow-input [ngModel]="macro.name"
                         maxParentWidthPercent="0.8"
                         [selectAfterInit]="isNew"
                         (ngModelChange)="editMacroName($event)"></auto-grow-input>
        <div class="titlebar-actions" role="group" aria-label="Macro actions">
            <button type="button"
                    class="macro__duplicate btn btn-link"
                    [class.disabled]="maxMacroCountReached"
                    [disabled]="maxMacroCountReached"
                    aria-label="Duplicate macro"
                    [ngbTooltip]="maxMacroCountReached ? maxAllowedMacrosTooltip : 'Duplicate macro'"
                    tooltipClass="tooltip-nowrap"
                    placement="bottom"
                    (click)="duplicateMacro()">
                <fa-icon [icon]="faCopy"></fa-icon>
            </button>
            <button type="button"
                    class="macro__remove btn btn-link"
                    aria-label="Delete macro"
                    ngbTooltip="Delete macro"
                    tooltipClass="tooltip-nowrap"
                    placement="bottom"
                    (click)="removeMacro()">
                <fa-icon [icon]="faTrash"></fa-icon>
            </button>
        </div>
    </div>
</uhk-header>
<back-to/>
<div *ngIf="assignments.length" class="my-2">
    <span class="me-1">Used on:</span>
    <ng-container *ngFor="let assignment of assignments; let last = last">
        <a class="text-nowrap"
           [routerLink]="['/keymap', assignment.keymapAbbreviation]"
           [queryParams]="{ layer: assignment.layerId, module: assignment.moduleId, key: assignment.keyId }">{{ assignment.label }}</a><span *ngIf="!last" class="mx-1">|</span>
    </ng-container>
</div>
