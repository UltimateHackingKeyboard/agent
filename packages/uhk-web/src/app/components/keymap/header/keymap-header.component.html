<uhk-header>
    <div class="pane-title">
        <fa-icon [icon]="faKeyboard"></fa-icon>
        <auto-grow-input [ngModel]="keymap.name"
                         maxParentWidthOffset="530"
                         (ngModelChange)="editKeymapName($event)"></auto-grow-input>
        <span class="pane-title__label text-nowrap">keymap (<input #abbr cancelable
                class="keymap__abbrev pane-title__abbrev"
                type="text"
                (change)="editKeymapAbbr($event.target.value)"
                (keyup.enter)="abbr.blur()"
                [attr.maxLength]="3"
    />)</span>
        <span *ngIf="inactiveKeymapTooltip"
              class="text-muted"
              [ngbTooltip]="inactiveKeymapTooltip"
              tooltipClass="tooltip-inactive-keymap"
              container="body"
              placement="bottom">(inactive)</span>
        <div class="titlebar-actions" role="group" aria-label="Keymap actions">
            <fa-icon [icon]="starIcon"
                     [ngbTooltip]="starTitle"
                     [class.keymap__is-default]="!keymap.isDefault"
                     placement="bottom"
                     (click)="setDefault()"
            ></fa-icon>
            <fa-icon [icon]="faCopy"
                     class="keymap__duplicate"
                     ngbTooltip="Duplicate keymap"
                     placement="bottom"
                     (click)="duplicateKeymap()"
            ></fa-icon>
            <fa-icon [icon]="faTrash"
                     [ngbTooltip]="trashTitle"
                     tooltipClass="tooltip-nowrap"
                     class="keymap__remove"
                     placement="bottom"
                     (click)="removeKeymap()"
            ></fa-icon>
        </div>
        <span class="titlebar-drag-surface"></span>
    </div>
</uhk-header>
