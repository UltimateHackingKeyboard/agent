<div class="text-center">
    <button *ngIf="showPlaceholder"
            type="button"
            class="btn btn-link p-0 text-center placeholder editable-text__trigger"
            (click)="editText()">{{ placeholder }}</button>

    <button *ngIf="showText"
            type="button"
            class="btn btn-link p-0 text-center editable editable-text__trigger"
            (click)="editText()">
            <ng-container *ngFor="let line of displayLines">{{line}}<br></ng-container>
    </button>
</div>

<div *ngIf="editing">
    <textarea class="text-editor"
              [(ngModel)]="text"
              autofocus
              (keydown.escape)="cancelEditText()"
              (keydown.control.enter)="keydownEnter()"
              (keydown.alt.enter)="keydownEnter()"></textarea>
    <div class="float-end buttons">
        <button class="btn btn-danger"
                (click)="cancelEditText()">
            Cancel
        </button>
        <button class="btn btn-primary"
                (click)="saveText()"
                [disabled]="isSaveDisabled">
            Update description
        </button>
    </div>
</div>
